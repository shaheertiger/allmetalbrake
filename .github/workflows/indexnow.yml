name: IndexNow

# After a push to the default branch, tell Bing (and through it DuckDuckGo,
# Yandex, Seznam and Naver) which pages changed, so they are recrawled within
# hours instead of weeks. Uses the key file already published at the site root.

on:
  push:
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in sitemap.xml"
        type: boolean
        default: true

jobs:
  submit:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which URLs changed
        id: urls
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
        run: |
          origin="https://www.allmetalbrake.com"
          if [[ "$ALL" == "true" || -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -E 's#</?loc>##g' > urls.txt
          else
            git diff --name-only --diff-filter=AMR "$BEFORE" "$AFTER" -- '*.html' \
              | sed -E "s#^index\.html\$##; s#^#${origin}/#" > urls.txt
          fi
          sort -u urls.txt -o urls.txt
          echo "count=$(wc -l < urls.txt)" >> "$GITHUB_OUTPUT"
          cat urls.txt

      # Give Vercel time to finish deploying so crawlers fetch the new version.
      - name: Wait for deploy
        if: steps.urls.outputs.count != '0'
        run: sleep 240

      - name: Submit to IndexNow
        if: steps.urls.outputs.count != '0'
        run: |
          mapfile -t urls < urls.txt
          bash indexnow-submit.sh "${urls[@]}"
