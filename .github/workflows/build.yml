name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and check content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # `npm run build` is `astro build` followed by the content gate, so a
      # page under 2700 words fails here exactly as it fails the Vercel deploy.
      - name: Build site and enforce the 2700-word minimum
        run: npm run build

      - name: Word count report
        if: always()
        run: npm run words
